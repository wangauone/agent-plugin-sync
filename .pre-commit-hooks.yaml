# Hooks this repo provides to other repos' .pre-commit-config.yaml.
# `generate` validates the source first, then rewrites the harness manifests;
# if anything changed, pre-commit fails the commit so the author re-stages.
- id: agent-plugin-sync
  name: agent-plugin-sync (regenerate harness manifests)
  description: Validate plugin.json + mcp.json and regenerate harness manifests.
  entry: agent-plugin-sync generate .
  language: python
  files: (^|/)(plugin\.json|mcp\.json)$
  pass_filenames: false
