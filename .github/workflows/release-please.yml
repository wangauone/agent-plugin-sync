# Release automation. release-please keeps a release PR open, accumulating
# conventional commits into a changelog and a version bump; merging it tags the
# release. Consumer repos pin that tag instead of tracking `main`, so a bad
# commit here cannot break their CI.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
