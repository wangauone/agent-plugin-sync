# Reusable workflow for plugin repos. By default it only validates (source valid
# + generated files current). With self_heal=true it also regenerates and commits
# any drift back to the PR branch — handy for Renovate's toolbox bumps.
#
# The self-heal commit inherits the PR head commit's author (renovate-bot on
# Renovate PRs, the human otherwise) so it stays CLA-cleared; the committer is
# github-actions[bot].
name: agent-plugin-sync

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref of agent-plugin-sync to run.
        type: string
        default: main
      self_heal:
        description: Regenerate and commit drift back to the PR branch (same-repo branches only).
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TOOL: git+https://github.com/wangauone/agent-plugin-sync@${{ inputs.ref }}
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Regenerate and commit drift
        if: ${{ inputs.self_heal }}
        run: |
          uvx --from "$TOOL" agent-plugin-sync generate .
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Manifests already up to date."
            exit 0
          fi
          # Inherit the PR author (CLA-cleared); committer stays github-actions[bot].
          author="$(git log -1 --pretty='%an <%ae>')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate plugin manifests" --author "$author"
          git push

      - name: Validate
        run: uvx --from "$TOOL" agent-plugin-sync validate .
