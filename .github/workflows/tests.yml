# CI for agent-plugin-sync itself.
#
# - `unit`: the fast, hermetic suite. Runs on every push/PR and gates merges.
# - `integration`: drives real harness CLIs (`pytest -m integration`). These start
#   an authenticated harness session, which CI runners don't have, so this job is
#   manual-only (workflow_dispatch) and never gates a PR. Run it where auth exists.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run pytest -q

  integration:
    # Only on manual dispatch: the harness sessions need auth CI doesn't have.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install harness CLIs
        run: npm install -g @openai/codex @google/gemini-cli @anthropic-ai/claude-code
      - name: Integration tests (harness CLIs)
        run: uv run pytest -m integration -v
