# Moves the `stable` tag to each new release, so ad-hoc commands can say
# `@stable` and get the latest release without the docs naming a version.
# Committed pins (the `uses:` line in consumer repos) stay on exact tags.
name: stable-tag

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point stable at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on workflow_dispatch, where we look the latest release up instead.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG:-$(gh release view --json tagName -q .tagName)}"
          sha="$(git rev-parse "$tag^{commit}")"
          echo "stable -> $tag ($sha)"
          # Via the refs API, not `git push`: GITHUB_TOKEN may not move a ref whose
          # commit carries different workflow files.
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/stable" \
            -f sha="$sha" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" \
                 -f ref="refs/tags/stable" -f sha="$sha"
