[project]
name = "agent-plugin-sync"
version = "0.1.0"
description = "Generate harness-specific plugin manifests (Gemini CLI, Claude Code, Codex, Antigravity) from a single Agent Plugin spec source (plugin.json + mcp.json)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
]

[project.scripts]
agent-plugin-sync = "agent_plugin_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_plugin_sync"]
